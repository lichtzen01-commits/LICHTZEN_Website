name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "deploy/bundle/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # deploy/bundle is the test HTML (homepage, sales workspace, admin preview)
      # with business data replaced by sample data. index.html loads its
      # resources from data/, so it works under any path.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: deploy/bundle

      - id: deployment
        uses: actions/deploy-pages@v4
