name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "deploy/site/**"
      - "deploy/bundle/**"
      - "scripts/build_static_site.py"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # /      = the homepage being renewed (deploy/site). Its links start at
      #          the domain root, so they are prefixed with /<repo>.
      # /test/ = the test HTML with the sales workspace (deploy/bundle, sample
      #          data only). It loads data/ relatively and needs no rewrite.
      # With a custom domain at the root, set SITE_BASE to an empty string.
      - name: Prepare site
        env:
          SITE_BASE: /${{ github.event.repository.name }}
        run: |
          cp -r deploy/site _site
          python3 -c "import sys; sys.path.insert(0, 'scripts'); import build_static_site as b; b.rebase('_site', '$SITE_BASE'); print('CSP added to', b.add_security_meta('_site'), 'pages')"
          cp -r deploy/bundle _site/test
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # A separate job, as in GitHub's own Pages template: deploying in the same job right after the
  # upload sometimes failed with "No artifacts named github-pages" because the upload was not listed yet.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
